name: build-ics

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ICS (all/media/event)
        run: |
          mkdir -p docs
          python scripts/generate_ics.py --cd all --months 8 --out docs/sakurazaka46_all.ics
          python scripts/generate_ics.py --cd media --months 8 --out docs/sakurazaka46_media.ics
          python scripts/generate_ics.py --cd event --months 8 --out docs/sakurazaka46_event.ics

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ICS"
            git push
          fi
